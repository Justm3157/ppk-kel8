<!DOCTYPE html><html lang="en" style=""><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Intelligence Designed To Evolve</title>

  <!-- Google Fonts: Inter 400, 500, 600 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">

  <!-- BubbledotICG-FinePos CDN via OnlineWebFonts -->
  <link href="https://db.onlinewebfonts.com/c/8cb707a9b8a73f8a7403336b861c3074?family=BubbledotICG-FinePos" rel="stylesheet">

  <!-- Font Awesome 6.5.2 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer">

  <style>
    @font-face {
      font-family: "Geist Pixel Circle";
      src: url("fonts/GeistPixel-Circle.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --bg: #000000;
      --text: #ffffff;
      --muted: #8e8e8e;
      --nav-text: #2e2e2e;
      --pill-dark: #28282a;
      --sign-in-text: #c8c8c8;
      --nav-shadow: 0 4px 14px rgba(0, 0, 0, 0.16);
      --trust-bg: #28282a;
      --trust-border: rgba(255, 255, 255, 0.4);
      --trust-text: #c4c2c3;
      --font-sans: "Inter", "Segoe UI", system-ui, sans-serif;
      --font-display: "BubbledotICG-FinePos", "Geist Pixel Circle", monospace;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100vh;
      height: 100dvh;
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Video Background Container */
    .bg {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background-color: #000;
      z-index: 0;
    }

    .bg-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      z-index: 0;
    }

    /* Subtle dark overlay for contrast guarantee */
    .bg-overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.55) 100%);
      pointer-events: none;
      z-index: 0;
    }

    /* Page layout: 1 viewport, 3 vertical regions */
    .page {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: clamp(16px, 2.4vh, 28px) clamp(14px, 3vw, 32px);
      overflow: hidden;
    }

    /* Animations */
    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-18px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes headlineFade {
      from {
        opacity: 0;
        transform: translateY(14px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes reveal {
      from {
        opacity: 0;
        transform: translateY(22px) scale(0.98);
        filter: blur(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
      }
    }

    @keyframes revealPulse {
      0% {
        opacity: 0;
        transform: translateY(22px) scale(0.96);
        filter: blur(6px);
      }
      70% {
        transform: translateY(-1px) scale(1.02);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
      }
    }

    .anim {
      opacity: 0;
      animation: reveal 0.85s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      animation-delay: var(--d, 0s);
    }

    /* 1) HEADER */
    .header {
      width: 100%;
      max-width: 720px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(18px, 2.8vw, 28px);
      flex-shrink: 0;
      animation: slideDown 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
      z-index: 10;
    }

    .logo-btn {
      width: clamp(40px, 4.4vw, 46px);
      height: clamp(40px, 4.4vw, 46px);
      border-radius: 50%;
      background-color: #ffffff;
      box-shadow: var(--nav-shadow);
      display: grid;
      place-items: center;
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
      flex-shrink: 0;
    }

    .logo-btn:hover {
      transform: scale(1.04);
    }

    .logo-btn img, .logo-btn svg {
      width: 72%;
      height: 72%;
      object-fit: contain;
    }

    /* Nav Pill */
    .nav-pill {
      height: clamp(44px, 5.2vw, 48px);
      max-width: 430px;
      flex: 1;
      background-color: #ffffff;
      border-radius: 999px;
      box-shadow: var(--nav-shadow);
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 4px 12px;
      list-style: none;
    }

    .nav-link {
      font-family: var(--font-sans);
      font-weight: 500;
      font-size: clamp(13px, 1.4vw, 15px);
      letter-spacing: -0.01em;
      color: var(--nav-text);
      text-decoration: none;
      opacity: 0.5;
      padding: 6px 10px;
      position: relative;
      transition: opacity 0.2s ease, transform 0.15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .nav-link:hover {
      opacity: 0.75;
    }

    .nav-link.active {
      opacity: 1;
    }

    /* Active 3-dots indicator under active link */
    .nav-link.active::after {
      content: "";
      position: absolute;
      bottom: 5px;
      left: 50%;
      width: 3px;
      height: 3px;
      background-color: #000000;
      border-radius: 50%;
      box-shadow: -5px 0 0 #000000, 5px 0 0 #000000;
      transform: translateX(-50%);
    }

    /* Sign In Pill */
    .btn-signin {
      height: clamp(44px, 5.2vw, 48px);
      padding: 0 clamp(18px, 2vw, 24px);
      border-radius: 999px;
      background-color: var(--pill-dark);
      color: var(--sign-in-text);
      font-family: var(--font-sans);
      font-size: clamp(13px, 1.4vw, 15px);
      font-weight: 500;
      letter-spacing: -0.01em;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--nav-shadow);
      border: none;
      cursor: pointer;
      flex-shrink: 0;
      transition: background-color 0.2s ease, color 0.2s ease, transform 0.2s ease;
    }

    .btn-signin:hover {
      background-color: #323234;
      color: #ffffff;
      transform: translateY(-1px);
    }

    /* Mobile Hamburger */
    .burger-btn {
      display: none;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background-color: #28282a;
      border: none;
      cursor: pointer;
      position: relative;
      box-shadow: var(--nav-shadow);
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 5px;
      transition: background-color 0.25s ease;
      z-index: 100;
    }

    .burger-bar {
      width: 18px;
      height: 1.5px;
      background-color: #ffffff;
      border-radius: 2px;
      transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1), background-color 0.25s ease, opacity 0.2s ease;
    }

    .burger-btn[aria-expanded="true"] {
      background-color: #ffffff;
    }

    .burger-btn[aria-expanded="true"] .burger-bar {
      background-color: #000000;
    }

    .burger-btn[aria-expanded="true"] .burger-bar:nth-child(1) {
      transform: translateY(6.5px) rotate(45deg);
    }
    .burger-btn[aria-expanded="true"] .burger-bar:nth-child(2) {
      opacity: 0;
    }
    .burger-btn[aria-expanded="true"] .burger-bar:nth-child(3) {
      transform: translateY(-6.5px) rotate(-45deg);
    }

    /* Mobile Menu Sheet & Overlay */
    .mobile-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.62);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 80;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.28s ease;
    }

    .mobile-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .mobile-menu-sheet {
      position: fixed;
      top: clamp(76px, 12vh, 90px);
      left: 16px;
      right: 16px;
      margin: 0 auto;
      max-width: 380px;
      background: #ffffff;
      border-radius: 28px;
      padding: 22px 18px 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
      z-index: 90;
      display: flex;
      flex-direction: column;
      gap: 12px;
      opacity: 0;
      transform: translateY(-16px) scale(0.97);
      pointer-events: none;
      transition: opacity 0.38s cubic-bezier(0.22, 1, 0.36, 1), transform 0.38s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .mobile-menu-sheet.open {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    .mobile-nav-links {
      display: flex;
      flex-direction: column;
      list-style: none;
      gap: 4px;
    }

    .mobile-nav-link {
      font-family: var(--font-sans);
      font-size: 16px;
      font-weight: 500;
      color: #2e2e2e;
      text-decoration: none;
      padding: 12px 16px;
      border-radius: 14px;
      position: relative;
      text-align: center;
      transition: background-color 0.15s ease;
    }

    .mobile-nav-link:hover {
      background-color: rgba(0, 0, 0, 0.05);
    }

    .mobile-nav-link.active {
      font-weight: 600;
    }

    .mobile-nav-link.active::after {
      content: "";
      position: absolute;
      bottom: 8px;
      left: 50%;
      width: 3px;
      height: 3px;
      background-color: #000;
      border-radius: 50%;
      box-shadow: -5px 0 0 #000, 5px 0 0 #000;
      transform: translateX(-50%);
    }

    .mobile-signin-btn {
      width: 100%;
      padding: 13px;
      background-color: var(--pill-dark);
      color: #ffffff;
      border-radius: 999px;
      border: none;
      font-family: var(--font-sans);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      margin-top: 4px;
    }

    /* 2) HERO */
    .hero {
      flex: 1;
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 8px 0;
      z-index: 5;
    }

    /* Trust Row */
    .trust-row {
      --trust-size: clamp(36px, 4.5vw, 42px);
      display: inline-flex;
      align-items: center;
      margin-bottom: clamp(16px, 2.5vh, 26px);
      position: relative;
      cursor: default;
    }

    .trust-avatar {
      width: var(--trust-size);
      height: var(--trust-size);
      background-color: var(--trust-bg);
      border: 1px solid var(--trust-border);
      border-radius: 50%;
      padding: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .trust-avatar .inner-circle {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background-color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .trust-avatar .inner-circle i {
      color: #111111;
      font-size: calc(var(--trust-size) * 0.34);
    }

    .trust-avatar:nth-child(1) {
      z-index: 1;
    }
    .trust-avatar:nth-child(2) {
      z-index: 2;
      margin-left: calc(var(--trust-size) * -0.42);
    }
    .trust-avatar:nth-child(3) {
      z-index: 4;
      margin-left: calc(var(--trust-size) * -0.42);
    }

    .trust-avatar:nth-child(1):hover {
      transform: translateY(-2px);
    }
    .trust-avatar:nth-child(2):hover {
      transform: translateY(-4px);
    }
    .trust-avatar:nth-child(3):hover {
      transform: translateY(-2px);
    }

    .trust-pill {
      height: var(--trust-size);
      background-color: var(--trust-bg);
      border: 1px solid var(--trust-border);
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      margin-left: calc(var(--trust-size) * -0.42);
      padding-left: calc(var(--trust-size) * 0.58);
      padding-right: clamp(14px, 2vw, 20px);
      z-index: 3;
    }

    .trust-pill span {
      font-family: var(--font-sans);
      font-weight: 500;
      color: var(--trust-text);
      font-size: clamp(12px, 1.4vw, 13.5px);
      letter-spacing: -0.01em;
      white-space: nowrap;
    }

    /* Headline */
    .headline {
      font-family: var(--font-display);
      color: #ffffff;
      font-size: clamp(28px, 6.2vw, 80px);
      letter-spacing: -0.04em;
      line-height: 1.12;
      font-weight: 400;
      text-transform: none;
      white-space: nowrap;
      margin-bottom: clamp(14px, 2vh, 22px);
      overflow: hidden;
    }

    .headline-line {
      display: block;
      opacity: 0;
      animation: headlineFade 0.85s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .headline-line:nth-child(1) {
      animation-delay: 0.12s;
    }

    .headline-line:nth-child(2) {
      animation-delay: 0.3s;
    }

    /* Subhead */
    .subhead {
      max-width: min(500px, 92%);
      font-family: var(--font-sans);
      font-size: clamp(calc(13.5px + 2pt), calc(1.55vw + 2pt), calc(16.5px + 2pt));
      color: #d0d0d0;
      opacity: 0.8;
      line-height: 1.55;
      font-weight: 400;
      margin-bottom: clamp(20px, 3vh, 32px);
    }

    /* CTA */
    .btn-cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: #ffffff;
      color: #000000;
      font-family: var(--font-sans);
      font-weight: 600;
      font-size: clamp(13.5px, 1.5vw, 14.5px);
      letter-spacing: -0.01em;
      padding: clamp(11px, 1.6vh, 13px) clamp(22px, 3vw, 28px);
      border-radius: 999px;
      text-decoration: none;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.15),
                  0 0 22px rgba(255, 255, 255, 0.32),
                  0 0 44px rgba(255, 255, 255, 0.12);
      transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.25s ease;
      cursor: pointer;
      border: none;
      animation: revealPulse 0.85s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      opacity: 0;
    }

    .btn-cta:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.25),
                  0 0 28px rgba(255, 255, 255, 0.55),
                  0 0 54px rgba(255, 255, 255, 0.25);
    }

    /* 3) STATS FOOTER */
    .stats-footer {
      width: 100%;
      max-width: 920px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: clamp(12px, 2.5vw, 28px);
      flex-shrink: 0;
      padding-top: 8px;
      z-index: 5;
    }

    .stat-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 2px;
    }

    .stat-top {
      display: inline-flex;
      align-items: baseline;
      justify-content: center;
      gap: 4px;
    }

    .stat-icon {
      font-family: var(--font-display);
      color: #ffffff;
      font-size: clamp(22px, 3vw, 33px);
      line-height: 1;
      user-select: none;
    }

    .stat-value {
      font-family: var(--font-sans);
      color: #ffffff;
      font-size: clamp(18px, 2.2vw, 26px);
      font-weight: 600;
      letter-spacing: -0.025em;
      font-variant-numeric: tabular-nums;
      line-height: 1.1;
    }

    .stat-label {
      font-family: var(--font-sans);
      color: var(--muted);
      font-size: clamp(11px, 1.2vw, 12.5px);
      letter-spacing: -0.01em;
      white-space: nowrap;
    }

    /* Responsive Breakpoints */
    @media (max-width: 720px) {
      .nav-pill, .btn-signin {
        display: none !important;
      }

      .header {
        max-width: 100%;
        justify-content: space-between;
      }

      .burger-btn {
        display: flex;
      }

      .headline {
        letter-spacing: -0.08em;
        line-height: 1.05;
      }

      .stats-footer {
        grid-template-columns: repeat(2, 1fr);
        row-gap: 16px;
      }
    }

    @media (max-width: 420px) {
      .trust-row {
        --trust-size: 34px;
      }

      .trust-pill span {
        font-size: 12px;
      }

      .headline {
        letter-spacing: -0.09em;
        line-height: 1.04;
      }
    }

    @media (max-height: 700px) {
      .page {
        padding: 12px 18px;
      }
      .trust-row {
        margin-bottom: 12px;
      }
      .subhead {
        margin-bottom: 16px;
      }
      .headline {
        margin-bottom: 10px;
      }
    }

    /* Accessibility: Reduced Motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
      .anim, .headline-line, .btn-cta, .header {
        opacity: 1 !important;
        transform: none !important;
        filter: none !important;
      }
      .headline {
        color: #ffffff;
      }
    }
  </style>
</head>

    <!-- 3) Stats Footer -->
    
  </div>

  <!-- Vanilla JS -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // 1. Mobile Menu Toggle Logic
      const burgerBtn = document.getElementById("burgerBtn");
      const mobileOverlay = document.getElementById("mobileOverlay");
      const mobileMenuSheet = document.getElementById("mobileMenuSheet");
      const mobileLinks = document.querySelectorAll(".mobile-nav-link, .mobile-signin-btn");

      const toggleMenu = (open) => {
        const isOpen = open !== undefined ? open : burgerBtn.getAttribute("aria-expanded") !== "true";
        burgerBtn.setAttribute("aria-expanded", String(isOpen));
        burgerBtn.classList.toggle("open", isOpen);
        mobileOverlay.classList.toggle("open", isOpen);
        mobileMenuSheet.classList.toggle("open", isOpen);
        mobileOverlay.setAttribute("aria-hidden", String(!isOpen));
        mobileMenuSheet.setAttribute("aria-hidden", String(!isOpen));
        document.body.classList.toggle("menu-open", isOpen);
      };

      if (burgerBtn) {
        burgerBtn.addEventListener("click", () => toggleMenu());
      }

      if (mobileOverlay) {
        mobileOverlay.addEventListener("click", () => toggleMenu(false));
      }

      mobileLinks.forEach(link => {
        link.addEventListener("click", () => toggleMenu(false));
      });

      window.addEventListener("keydown", (e) => {
        if (e.key === "Escape") toggleMenu(false);
      });

      window.addEventListener("resize", () => {
        if (window.innerWidth > 720) {
          toggleMenu(false);
        }
      });

      // 2. Count-Up Animation for Stats
      const statElements = document.querySelectorAll(".stat-value");
      const prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      if (!prefersReducedMotion && statElements.length > 0) {
        const easeOutCubic = (t) => (--t) * t * t + 1;

        const animateValue = (el, target, suffix, decimals, duration, delay) => {
          setTimeout(() => {
            let startTimestamp = null;
            const step = (timestamp) => {
              if (!startTimestamp) startTimestamp = timestamp;
              const progress = Math.min((timestamp - startTimestamp) / duration, 1);
              const currentVal = easeOutCubic(progress) * target;
              
              el.textContent = currentVal.toFixed(decimals) + suffix;

              if (progress < 1) {
                window.requestAnimationFrame(step);
              } else {
                el.textContent = target.toFixed(decimals) + suffix;
              }
            };
            window.requestAnimationFrame(step);
          }, delay);
        };

        const observer = new IntersectionObserver((entries, obs) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              statElements.forEach((el, i) => {
                const target = parseFloat(el.getAttribute("data-target"));
                const suffix = el.getAttribute("data-suffix") || "";
                const decimals = parseInt(el.getAttribute("data-decimals"), 10) || 0;
                const duration = 1500 + i * 80;
                const delay = 480 + i * 90;
                animateValue(el, target, suffix, decimals, duration, delay);
              });
              obs.disconnect();
            }
          });
        }, { threshold: 0.25 });

        const footer = document.querySelector(".stats-footer");
        if (footer) observer.observe(footer);
      }
    });
  </script>
